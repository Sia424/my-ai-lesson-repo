<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/site/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">AI</span>{{ site.title }}</a>
    <a class="repo-link" href="https://github.com/{{ site.repository }}">GitHub ↗</a>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <p class="nav-label">从这里开始</p>
      <nav aria-label="教程导航">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
        <a href="{{ '/chapters/' | relative_url }}"{% if page.url == '/chapters/' %} aria-current="page"{% endif %}>教程目录</a>
        <a href="{{ '/introduction/' | relative_url }}"{% if page.url == '/introduction/' %} aria-current="page"{% endif %}><span>01</span>认识 AI Agent</a>
        <a href="{{ '/safety/' | relative_url }}"{% if page.url == '/safety/' %} aria-current="page"{% endif %}><span>02</span>使用前的安全常识</a>
        <a href="{{ '/github-setup/' | relative_url }}"{% if page.url == '/github-setup/' %} aria-current="page"{% endif %}><span>03</span>注册 GitHub 账号</a>
        <a href="{{ '/agent-rules/' | relative_url }}"{% if page.url == '/agent-rules/' %} aria-current="page"{% endif %}><span>04</span>给 Agent 立规矩</a>
      </nav>
      <p class="coming">后续章节持续更新中</p>
      <a class="license-link" href="{{ '/license/' | relative_url }}">署名与使用许可</a>
    </aside>
    <main id="main" tabindex="-1">
      <article class="prose{% if page.home %} home{% endif %}">
        {{ content }}
      </article>
      <footer class="page-footer">
        <span>Sia · AI Agent 入门指南</span>
        <a href="{{ '/license/' | relative_url }}">CC BY-NC 4.0 · 商业使用须授权</a>
      </footer>
    </main>
  </div>
</body>
</html>
